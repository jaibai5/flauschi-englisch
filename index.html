<script>/* Flauschi-Konto v1 – gemeinsames Punktekonto aller Flauschi-Lernapps (Klarinette, Englisch, Mathe, …).
   Vertrag: docs/FLAUSCHI_KONTO.md. Diese Datei wird in jede Lern-App unverändert kopiert (Prüfsumme vergleichen).
   Funktioniert nur, wenn alle Apps unter derselben Herkunft laufen: https://jaibai5.github.io/<app>/
   Lern-Apps rufen nur earn() und setProfile() auf. Ausgeben (spend) darf nur die App mit Laden und Spiel. */
(function (root) {
  'use strict';
  var KEY = 'flauschi_konto_v1', V = 1, LOG_MAX = 300, APP_RE = /^[a-z][a-z0-9-]{1,23}$/;

  function today(d) { d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function int(x) { return Math.max(0, Math.floor(+x || 0)); }
  function fresh() { return { v: V, stars: 0, tix: 0, name: '', char: '', own: [], wear: {}, set: { gameLimit: 5 }, apps: {}, log: [] }; }
  function fill(o) {
    var f = fresh(), k;
    o.stars = int(o.stars); o.tix = int(o.tix);
    for (k in f) if (o[k] === undefined || o[k] === null || typeof o[k] !== typeof f[k] || Array.isArray(o[k]) !== Array.isArray(f[k])) o[k] = f[k];
    o.stars = int(o.stars); o.tix = int(o.tix); o.name = String(o.name).slice(0, 20);
    return o;
  }
  function store() { try { return root.localStorage; } catch (e) { return null; } }
  function read() {
    var ls = store();
    try { var o = JSON.parse((ls && ls.getItem(KEY)) || 'null'); if (o && typeof o === 'object' && !Array.isArray(o) && typeof o.v === 'number') return fill(o); } catch (e) {}
    return fresh();
  }
  function write(o) { var ls = store(); try { if (!ls) return false; ls.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
  function checkApp(app) { if (!APP_RE.test(String(app))) throw new Error('FlauschiKonto: ungültiger App-Name "' + app + '" (klein, z. B. "englisch")'); }
  function book(o, app, stars, tix, why) {
    var a = o.apps[app] || (o.apps[app] = { stars: 0, tix: 0, last: '' });
    if (stars > 0) a.stars += stars; if (tix > 0) a.tix += tix; a.last = today();
    o.log.push({ t: Date.now(), app: app, stars: stars, tix: tix, why: String(why || '').slice(0, 60) });
    if (o.log.length > LOG_MAX) o.log = o.log.slice(-LOG_MAX);
  }

  // Gutschrift für echte Lernleistung. Gibt den neuen Stand zurück.
  function earn(app, stars, tix, why) {
    checkApp(app); stars = int(stars); tix = int(tix);
    var o = read(); if (!stars && !tix) return o;
    o.stars += stars; o.tix += tix; book(o, app, stars, tix, why); write(o); return o;
  }
  // Ausgabe (Laden, Spielrunde). false, wenn nicht genug da ist; dann ändert sich nichts.
  function spend(app, stars, tix, why) {
    checkApp(app); stars = int(stars); tix = int(tix);
    var o = read(); if (o.stars < stars || o.tix < tix) return false;
    o.stars -= stars; o.tix -= tix; book(o, app, -stars, -tix, why); write(o); return o;
  }
  // Name und Figur: leere Werte überschreiben nie vorhandene.
  function setProfile(p) {
    p = p || {}; var o = read();
    if (p.name && String(p.name).trim()) o.name = String(p.name).trim().slice(0, 20);
    if (p.char && String(p.char).trim()) o.char = String(p.char).trim().slice(0, 12);
    write(o); return o;
  }
  // Summe je App in den letzten n Tagen (für Elternbereiche): { klarinette: { stars, tix }, … }
  function week(n) {
    var from = Date.now() - (n || 7) * 864e5, out = {};
    read().log.forEach(function (e) { if (e.t >= from && (e.stars > 0 || e.tix > 0)) { var s = out[e.app] || (out[e.app] = { stars: 0, tix: 0 }); s.stars += Math.max(0, e.stars); s.tix += Math.max(0, e.tix); } });
    return out;
  }

  function persist() { try { if (root.navigator && navigator.storage && navigator.storage.persist) return navigator.storage.persist(); } catch (e) {} return Promise.resolve(false); }

<script>/* Flauschis Englisch · Aussprache und Klänge.
   Weg 1: vorab erzeugte Aufnahmen (voice-data.js, MP3) über WebAudio – geht auf dem Fire HD 8 auch ohne Netz.
   Weg 2: Stimme des Geräts (speechSynthesis, en-GB), nur wenn gewählt oder eine Aufnahme fehlt.
   Kurze Töne für richtig/falsch über WebAudio. Stellt window.ENAUDIO bereit. */
(function () {
'use strict';
const VOICE = window.EN_VOICE || { clips: {} };
let ctx = null, cur = null; const cache = {};
let mode = 'auto', mute = false;

  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  return ctx;
}
// Beim ersten Tippen freischalten (Browser erlauben Ton erst nach einer Berührung)
const unlock = () => { const c = ac(); if (c) { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } };
['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock, { once: true, capture: true }));

const key = t => String(t).toLowerCase().trim();
const has = t => !!VOICE.clips[key(t)];
function b64(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
function buffer(t) {
  const k = key(t);
  if (!cache[k]) cache[k] = new Promise((ok, no) => { const c = ac(); if (!c) return no(new Error('kein WebAudio')); c.decodeAudioData(b64(VOICE.clips[k]), ok, no); });
  return cache[k];
}
function stop() { try { if (cur) cur.stop(0); } catch (e) {} cur = null; try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} }
function tts(t) {
  return new Promise(ok => {
    try {
      const u = new SpeechSynthesisUtterance(t), vs = speechSynthesis.getVoices();
      u.lang = 'en-GB'; u.rate = 0.85;
      u.voice = vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
      u.onend = u.onerror = () => ok(true); speechSynthesis.speak(u); setTimeout(() => ok(true), 4000);
    } catch (e) { ok(false); }

// Spricht einen englischen Text. Gibt ein Promise zurück, das nach dem Abspielen erfüllt ist.
function say(t) {
  if (mute || mode === 'off') return Promise.resolve(false);
  stop(); window.ENAUDIO.last = t;

    if (!seen[k]) seen[k] = [(R() - 0.5) * amt, (R() - 0.5) * amt * 0.5, (R() - 0.5) * amt];
    const d = seen[k]; p.setXYZ(i, x + d[0], y + d[1], z + d[2]);
  }
  g.computeVertexNormals(); return g;
}
function islandBase(r) {
  const g = new T.Group();
  const rock = new T.Mesh(jitter(new T.CylinderGeometry(r * 1.08, r * 0.55, 1.6, 9, 1), 0.25, r), LM(0x9a8a7a)); rock.position.y = -0.9; g.add(rock);
  const sand = new T.Mesh(jitter(new T.CylinderGeometry(r, r * 1.1, 0.4, 12, 1), 0.18, r + 1), LM(0xf3d9a0)); sand.position.y = -0.08; sand.receiveShadow = true; g.add(sand);
  const gs = new T.Mesh(jitter(new T.CylinderGeometry(r * 0.8, r * 0.8 + 0.08, 0.2, 12, 1), 0.14, r + 2, true), LM(0x86d36a)); gs.position.y = 0.12; gs.receiveShadow = true; g.add(gs);
  g.top = 0.22; return g;
}
const put = (g, name, x, z, s, ry, y) => { const m = K.model(name, { s: s || 1 }); m.position.set(x, y == null ? g.top : y, z); m.rotation.y = ry || 0; g.add(m); return m; };
function island(theme, r) {
  const g = islandBase(r || 1.55), R = rnd(theme * 31 + 5);
  if (theme === 0) {
    put(g, 'tree_oak', -0.95, -0.7, 1.15, 0.4); put(g, 'tree_palmBend', 1.15, -0.55, 1.1, 2.6); put(g, 'tree_fat', -0.2, -1.15, 1, 1);
    put(g, 'plant_bushDetailed', 1.0, 0.45, 0.9); put(g, 'flower_redA', -0.85, 0.5, 1.6); put(g, 'flower_yellowB', -0.65, 0.75, 1.6, 1); put(g, 'flower_purpleA', 0.7, 0.85, 1.6, 2);
    put(g, 'mushroom_redGroup', -1.15, 0.05, 1.4); put(g, 'rock_smallA', 1.35, 0.1, 1.2, 0, 0.06); put(g, 'sign', 0.55, -0.7, 1.2, -0.5);
  } else {
    [['tree_default', -0.6, -0.4], ['tree_oak', 0.5, -0.6], ['tree_pineRoundA', 0.9, 0.3], ['tree_palm', -0.9, 0.3]].forEach((t, i) => { if ((i + theme) % 3) put(g, t[0], t[1], t[2], 0.9, R() * 6); });
    put(g, 'flower_redA', 0.1, 0.5, 1.4); put(g, 'rock_smallA', -0.3, 0.7, 1, 0, 0.06);
  }
  g.traverse(x => { if (x.isMesh) x.castShadow = true; });

}
function clouds(scene, n, spread, y) {
  const m = new T.MeshLambertMaterial({ color: 0xffffff, emissive: 0x8a96a8, flatShading: true }), list = [];
  for (let i = 0; i < n; i++) { const c = new T.Group(); [[0, 0, 0.6], [0.6, 0.1, 0.45], [-0.6, -0.05, 0.5], [0.2, 0.3, 0.45]].forEach(b => { const s = new T.Mesh(new T.IcosahedronGeometry(b[2], 1), m); s.position.set(b[0], b[1], 0); c.add(s); }); c.position.set((Math.random() - 0.3) * spread, y + Math.random() * 1.5, -6 - Math.random() * 10); c.sp = 0.1 + Math.random() * 0.15; scene.add(c); list.push(c); }
  return list;
}
// Schwebende Buchstaben statt Noten (wie die Noten im Klarinetten-Start)
function letters(scene) { const a = []; ['A', 'b', 'C', 'hi!'].forEach((ch, i) => { const s = K.textSprite(ch, { color: ['#ff4f8b', '#7b5cff', '#2fb35a', '#ffb03a'][i], size: 72, h: ch.length > 1 ? 0.3 : 0.34 }); s.ph = i / 4; scene.add(s); a.push(s); }); return a; }

A.home = (sec, cid, wear, figEl, onTap) => {
  T = K.T; A.leave();
  let host = sec.querySelector('.bg3d'); if (!host) { host = document.createElement('div'); host.className = 'bg3d'; sec.insertBefore(host, sec.firstChild); }
  sec.classList.add('g3d');
  const scene = new T.Scene(); scene.background = K.sky('#7fcfff', '#e6f7ff'); scene.fog = new T.Fog(0xdff3ff, 14, 40);
  K.lights(scene, { size: 3.2, sx: 3, sz: 5 });
  const cam = new T.PerspectiveCamera(32, 1, 0.1, 80);
  const water = K.water(120, 60, 0x3fbfef); water.position.set(0, 0, -10); scene.add(water);
  const isl = island(0, 1.75); scene.add(isl);
  [[-9, -16, 1.3, 2], [7, -20, 1.6, 3], [16, -12, 1.1, 4]].forEach(p => { const x = island(p[3], p[2]); x.position.set(p[0], 0, p[1]); scene.add(x); });
  const boat = K.model('canoe', { s: 1.3 }); boat.position.set(2.9, 0.02, 0.9); boat.rotation.y = 0.6; scene.add(boat);
  const fig = K.char(cid, wear); fig.position.set(0, isl.top, 0.25); fig.rotation.y = -0.9; fig.look = -0.25; scene.add(fig);
  const cl = clouds(scene, 6, 30, 5), ls = letters(scene);
  let jump = 0, wave = 2;
  const fit = () => {
    const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
    const b = figEl.getBoundingClientRect(), hb = host.getBoundingClientRect();
    const cx = b.width ? b.left + b.width / 2 - hb.left : w * 0.18, cy = b.height ? b.top + b.height * 0.55 - hb.top : h * 0.6;
    cam.position.set(0, 1.9, 6.6); cam.lookAt(0, 0.55, 0); cam.fov = 30;
    cam.setViewOffset(w, h, w / 2 - cx, h / 2 - cy, w, h); cam.updateProjectionMatrix();
  };
  const tap = ev => { if (K.pick(ev, cam, [fig])) { jump = 1.2; if (onTap) onTap(); } };
  host.addEventListener('pointerdown', tap);
  K.live(host, {
    scene, camera: cam, resize: fit,
    update(dt, t) {
      water.tick(t); boat.position.y = Math.sin(t * 1.3) * 0.04; boat.rotation.z = Math.sin(t * 1.1) * 0.05;
      cl.forEach(c => { c.position.x += c.sp * dt; if (c.position.x > 18) c.position.x = -18; });
      wave -= dt; if (wave < 0) wave = 7 + Math.random() * 4;
      if (jump > 0) { jump -= dt; fig.pose(t, 'cheer'); } else fig.pose(t, wave < 1.6 ? 'wave' : 'idle');
      ls.forEach(s => { const p = (t * 0.2 + s.ph) % 1; s.position.set(0.5 + Math.sin(p * 7 + s.ph * 6) * 0.4, 1.3 + p * 1.6, 0.3); s.material.opacity = Math.sin(p * Math.PI) * 0.9; });
    },
    dispose() { host.removeEventListener('pointerdown', tap); sec.classList.remove('g3d'); }
  });
  setTimeout(fit, 0);
};
A.img = (cid, wear, cls, pose) => `<img class="${cls || 'f3d'}" alt="" draggable="false" src="${K.snap(cid, wear, 300, 330, pose ? { pose, t: 0.26 } : undefined)}">`;
A.leave = () => { K.stopLive(); };
})();
</script>
<script>/* Flauschis Englisch · Oberfläche. Braucht EN (logic.js), EN_PICS, ENDRAW, ENAUDIO, optional FlauschiKonto.
   Bildschirme: who (Erststart), home, topic, ex (Übung), par (Eltern). Ergebnis und Fenster im #modal.
   Für Tests: window.ENAPP. */
(function () {
'use strict';
const EN = window.EN, P = window.EN_PICS, DR = window.ENDRAW, AU = window.ENAUDIO, K = window.FlauschiKonto || null, META = window.EN_META || {};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let LS; try { LS = window.localStorage; LS.getItem('x'); } catch (e) { const m = {}; LS = { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }
let S = EN.load(LS);
const save = () => EN.save(LS, S);
let RUN = null;           // laufende Übung
let busy = false;         // während Rückmeldung keine Eingaben

// ---------- Hilfen ----------
const ic = n => P.icon(n);
const starsHTML = (n, max) => '<span class="stars">' + Array.from({ length: max || 3 }, (_, i) => `<span class="${i < n ? '' : 'off'}">${ic('star')}</span>`).join('') + '</span>';
function show(id) { if (window.K3DAPP) window.K3DAPP.leave(); SCREEN = id; document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }
function toast(t, ms) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), ms || 1800); }
function modal(html) { const m = $('#modal'); m.innerHTML = '<div class="box">' + html + '</div>'; m.classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
const konto = () => K ? K.read() : { stars: 0, tix: 0, name: '', char: '', wear: {} };
// Kleidung: aus dem Flauschi-Konto (gemeinsamer Laden). Übergang, solange der Klarinetten-Laden noch im eigenen Spielstand bucht:
// Ist im Konto nichts angezogen, wird die Kleidung aus dem Klarinetten-Spielstand nur gelesen (gleiche Herkunft jaibai5.github.io).

// 3D wie Klarinette (nur Testseite): Figuren als 3D-Standbild, Start lebt in 3D. 2D-Zeichnung nur als Notlösung (kein WebGL, Datei-Version, „Grafik: einfach“).
const G3D = () => !!(window.K3D && window.K3D.ok && window.K3DAPP);
const P3D = () => !!(window.K3D && !window.K3D.ok && !window.K3D.failed);   // 3D lädt noch: nichts zeigen statt 2D, sonst springt das Bild
let SCREEN = '';
const fig = (cid, wear, cls, pose) => P3D() ? `<div class="ph3d ${cls || ''}"></div>` : G3D() ? window.K3DAPP.img(cid, wear || {}, 'f3d ' + (cls || ''), pose) : DR.charSVG(cid, wear || {}, cls || 'chr');
const ava = cls => `<span class="${cls || 'ava'}">${fig(me().char, me().wear, '', '')}</span>`;
const topicOf = id => EN.TOPICS.find(t => t.id === id);
const catOf = id => EN.CATS.find(c => c.id === id);
// Flauschi Land (gleiche Adresse jaibai5.github.io = gleiches Konto). Nur auf der Testseite, in der Datei-Version führt der Link ins Leere.
const landURL = () => (META.land && /^https?:$/.test(location.protocol)) ? META.land : '';
AU.setMode(S.set.voice);
// Vollbild wie Klarinette: braucht ein Tippen, darum beim ersten Tippen (und nach dem Verlassen beim nächsten). 'auto' = nur auf Tablets.
const TABLET = /Silk|Android|iPad/i.test(navigator.userAgent) || !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
const APPMODE = () => !!(window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches));
function fullOn() {
  const m = S.set.full || 'auto'; if (m === 'off' || (m === 'auto' && !TABLET)) return;
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement || APPMODE() || !(el.requestFullscreen || el.webkitRequestFullscreen)) return;
  try { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
document.addEventListener('pointerup', fullOn, true);

// ---------- Erststart ----------
function who(edit) {

// ---------- Start ----------
function bar(title, back) {
  const k = konto();
  return `<div class="bar">${back ? `<button class="ib" data-act="${back}" aria-label="Zurück">${ic('home')}</button>` : ava()}
    <h1>${title}</h1>
    <span class="chip">${ic('star')}<span id="kStars">${k.stars}</span></span>

function home() {

  const nm = me().name;

    <div class="row">
      <button class="big main" data-act="daily">${ic('today')}<span>Heute üben<small>Flauschi sucht die Wörter aus</small></span></button>

    }).join('')}</div>
    <div class="row" style="flex:0 0 auto;justify-content:space-between;align-items:center">
      <button class="btn alt" data-act="par">${'Eltern'}</button>
      ${landURL() ? `<a class="btn land" id="hLand" href="${esc(landURL())}">${ic('land')}<span>Flauschi Land<small>Tickets einlösen</small></span></a>` : `<span style="opacity:.75;font-size:.9em">${K ? 'Sterne und Tickets kommen ins Flauschi-Konto für Flauschi Land.' : ''}</span>`}

// ---------- Thema ----------
function topic(id) {

  const exs = EN.EX.concat(sortable ? [{ id: 'sort', de: 'Sortieren', icon: 'sort', scored: true, info: 'Ordne die Wörter in Gruppen' }] : []);
  el.innerHTML = bar(`${t.en} <small style="font-weight:400;font-size:.65em">${t.de} · Heft Seite ${t.page}</small>`, 'home') + `<div class="body"><div class="tw">

// ---------- Übung: Ablauf ----------
// RUN: { key, mode: practice|test, tasks: [{id, kind, cats?}], i, ok, n, res: [], retry: Set, t0 }
function startRun(key, tasks, opts) {

function start(topicId, ex) {

function startDaily() { startRun('daily', EN.daily(S), { title: 'Heute üben', daily: true }); }

}
function testGo() {

  if (!topics.length) { toast('Wähle mindestens ein Thema.'); return; }
  closeModal();
  const tasks = EN.testTasks(S, topics).map(t => t.kind === 'sort' ? Object.assign(t, { cats: EN.catChoices(t.id) }) : t);
  startRun('test', tasks, { title: 'Test', mode: 'test' });
}
const task = () => RUN && RUN.tasks[RUN.i];

function exBar() {
  const dots = RUN.tasks.slice(0, RUN.n).map((t, i) => `<i class="${i < RUN.res.length ? (RUN.res[i].ok ? 'ok' : 'bad') : i === RUN.i ? 'cur' : ''}"></i>`).join('');

    <span class="chip">${RUN.i + 1}/${RUN.tasks.length}</span></div>`;
}
function renderTask() {

  const w = EN.word(t.id), el = $('#ex');
  RUN.first = true; RUN.tries = 0;
  const kind = t.kind;
  let body = '';
  const sayBtn = (cls) => `<button class="say ${cls || ''}" data-act="say" data-t="${esc(w.en)}">${ic('speaker')}<span>Hören</span></button>`;
  const left = (opts) => `<div class="left"><span class="pic">${P.svg(w.id)}</span>${opts.de ? `<span class="de">${esc(w.de)}</span>` : ''}${opts.say ? sayBtn() : ''}</div>`;
  if (kind === 'learn') {
    body = `<div class="lcard"><span class="pic">${P.svg(w.id)}</span><div><div class="en">${esc(w.en)}</div><div class="de">${esc(w.de)}</div>${sayBtn('huge')}
      <p style="opacity:.8">Hör zu und sprich nach!</p></div></div>
      <div style="display:flex;flex-direction:column;justify-content:center;gap:2vh"><button class="btn" data-act="next">Weiter ›</button>${RUN.i > 0 ? '<button class="btn alt" data-act="prev">‹ Zurück</button>' : ''}</div>`;
  } else if (kind === 'pic') {
    RUN.opts = EN.choices(w, 4);
    body = left({}) + `<div class="right"><div class="prompt">Welches Wort passt zum Bild?</div><div class="opts">${RUN.opts.map(o => `<button class="opt" data-act="pick" data-v="${o.id}">${esc(o.en)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
  } else if (kind === 'listen') {
    RUN.opts = EN.choices(w, 4);
    body = `<div class="left">${sayBtn('huge')}<div class="prompt">Hör zu! Welches Bild ist es?</div></div>
      <div class="right"><div class="opts">${RUN.opts.map(o => `<button class="opt picopt" data-act="pick" data-v="${o.id}" aria-label="Bild">${P.svg(o.id)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;

function slotsHTML(target, typed, marks) {

function typeKey(k) {
  if (busy || !RUN) return;
  const t = task(); if (!t || t.kind !== 'write' || RUN.phase === 'study') return;
  const w = EN.word(t.id), max = RUN.mode === 'test' ? 30 : EN.norm(w.en).replace(/ /g, '').length;

  else if (/^[a-z]$/.test(k) && RUN.typed.replace(/ /g, '').length < max) RUN.typed += k;
  if (RUN.mode === 'test') $('#line').innerHTML = esc(RUN.typed) + '<span style="opacity:.4">|</span>';
  else { $('#slots').innerHTML = slotsHTML(EN.norm(w.en), RUN.typed); if (RUN.typed.replace(/ /g, '').length === max) { const tok = RUN.tok = (RUN.tok || 0) + 1; setTimeout(() => { if (RUN && RUN.tok === tok && task() === t && !busy && RUN.phase !== 'study') submitWrite(); }, 350); } }

// In der Übung tippt das Kind nur Buchstaben; Leerzeichen setzt die Lückenanzeige. Verglichen wird ohne Leerzeichen-Fehler.
function typedWord(w) {

}
async function submitWrite() {
  if (!RUN || RUN.phase === 'study') return;

  const t = task(), w = EN.word(t.id), input = typedWord(w), ok = EN.check(input, w.en);

  if (RUN.mode === 'test') { busy = true; record(ok, input); await sleep(250); return next(); }

    busy = true; AU.tone('ok');

function setupPad() {
  const cv = $('#cv'), pad = $('#pad'), r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(10, r.width * dpr); cv.height = Math.max(10, r.height * dpr);
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const lines = () => { g.strokeStyle = '#d9ccff'; g.lineWidth = 2; [0.42, 0.62, 0.82].forEach((y, i) => { g.setLineDash(i === 1 ? [8, 8] : []); g.beginPath(); g.moveTo(10, r.height * y); g.lineTo(r.width - 10, r.height * y); g.stroke(); }); g.setLineDash([]); };
  lines(); RUN.padClear = () => { g.clearRect(0, 0, r.width, r.height); lines(); };
  let down = false, last = null;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { down = true; last = pt(e); try { cv.setPointerCapture(e.pointerId); } catch (x) {} };
  cv.onpointermove = e => { if (!down) return; const p = pt(e); g.strokeStyle = '#3d2f4f'; g.lineWidth = e.pointerType === 'pen' ? 3.2 : 4.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p; RUN.drawn = true; };
  cv.onpointerup = cv.onpointercancel = () => { down = false; };
}

    <div class="btns"><button class="btn alt" data-act="resback">Fertig</button><button class="btn" data-act="again">Nochmal</button></div>`);

    <h2>Einstellungen</h2>
    <div class="set">Aussprache: ${[['auto', 'Aufnahmen (empfohlen)'], ['tts', 'Stimme des Geräts'], ['off', 'aus']].map(([v, n]) => `<button class="btn alt ${S.set.voice === v ? 'sel' : ''}" data-act="voice" data-v="${v}">${n}</button>`).join('')}
      <button class="btn" data-act="say" data-t="pencil sharpener">Testen: „pencil sharpener“</button></div>
    <div class="set">Deutsches Wort beim Schreiben zeigen: ${[[true, 'ja'], [false, 'nein (schwerer)']].map(([v, n]) => `<button class="btn alt ${S.set.de === v ? 'sel' : ''}" data-act="setde" data-v="${v ? 1 : 0}">${n}</button>`).join('')}</div>
    <div class="set">Grafik: ${[['3d', '3D (empfohlen)'], ['2d', 'einfach (falls das Tablet ruckelt)']].map(([v, n]) => `<button class="btn alt ${S.set.gfx === v ? 'sel' : ''}" data-act="gfx" data-v="${v}">${n}</button>`).join('')}
      <small>${G3D() ? '3D läuft' + (window.K3D.low ? ' (Auflösung automatisch gesenkt)' : '') : window.K3D && window.K3D.failed ? 'einfach (' + esc(window.K3D.err) + ')' : window.K3D ? '3D lädt …' : 'Datei-Version ohne 3D'}</small></div>
    <div class="set">Vollbild: ${[['auto', 'automatisch auf Tablets'], ['on', 'immer'], ['off', 'aus']].map(([v, n]) => `<button class="btn alt ${S.set.full === v ? 'sel' : ''}" data-act="full" data-v="${v}">${n}</button>`).join('')}</div>
    <div class="set"><button class="btn alt" data-act="who">Figur und Name ändern</button><button class="btn warn" data-act="reset">Englisch-Lernstand löschen</button></div>
    <h2>Technik</h2>
    <p>Version ${esc(META.version)} (${esc(META.built)}). Aufnahmen: ${ai.clips} (Stimme ${esc(ai.voice)}), WebAudio ${ai.webaudio ? 'ja' : 'nein'}, Gerätestimme ${ai.tts ? (ai.ttsVoices.length ? ai.ttsVoices.length + ' englische' : 'keine englische gefunden') : 'nicht vorhanden'}.
      <b>Speichern geht automatisch</b> nach jeder Aufgabe und jeder Runde, auf diesem Gerät in diesem Browser (kein Knopf nötig). Spielstand: Schlüssel ${EN.KEY}, Konto: flauschi_konto_v1. Offline: ${navigator.serviceWorker && navigator.serviceWorker.controller ? 'bereit' : 'nur mit Internet (oder Datei-Version)'}.</p>
    <p><button class="btn alt" data-act="about">Über die App</button></p>
  </div>`;
  show('par');
}
function about() {
  modal(`<h2>Flauschis Englisch</h2><p>Version ${esc(META.version)} · ${esc(META.built)}</p>
    ${(META.credits || []).map(c => `<p><b>${esc(c[0])}:</b> ${esc(c[1])}</p>`).join('')}
    <p style="font-size:.85em;opacity:.8;max-width:40em">${esc(META.note || '')}</p>
    <div class="btns"><button class="btn" data-act="close">Schließen</button></div>`);
}

// ---------- Ereignisse ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  switch (a) {
    case 'home': return home();
    case 'topic': return topic(b.dataset.id);
    case 'start': closeModal(); return start(b.dataset.topic, b.dataset.ex);
    case 'daily': return startDaily();
    case 'sortall': return startSort(EN.TOPICS.map(t => t.id), 'sort', 'home');
    case 'test': return startTest();
    case 'testgo': return testGo();
    case 'hear': case 'say': return AU.say(b.dataset.t || EN.word(b.dataset.id).en);
    case 'pick': case 'cat': return pick(b);
    case 'tile': return tile(b);
    case 'key': return typeKey(b.dataset.k);
    case 'cover': return cover();
    case 'next': return next();
    case 'prev': RUN.i = Math.max(0, RUN.i - 1); return renderTask();
    case 'penclear': return RUN.padClear && RUN.padClear();
    case 'pendone': return penDone();
    case 'penself': return penSelf(b.dataset.v === '1');
    case 'quit': { const back = RUN && RUN.back, tp = RUN && RUN.topic; AU.stop(); RUN = null; return back === 'topic' ? topic(tp) : home(); }
    case 'resback': { const back = RUN.back, tp = RUN.topic; closeModal(); return back === 'topic' ? topic(tp) : home(); }
    case 'again': return again();
    case 'close': return closeModal();
    case 'par': return parentsGate();
    case 'gate': if (b.dataset.ok === '1') return parents(); closeModal(); return toast('Das war nicht richtig.');
    case 'voice': S.set.voice = b.dataset.v; AU.setMode(S.set.voice); save(); return parents();
    case 'gfx': S.set.gfx = b.dataset.v; save(); return location.reload();
    case 'full': S.set.full = b.dataset.v; save(); if (S.set.full === 'off' && (document.fullscreenElement || document.webkitFullscreenElement)) try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (x) {} return parents();
    case 'setde': S.set.de = b.dataset.v === '1'; save(); return parents();
    case 'who': closeModal(); return who(true);
    case 'about': return about();
    case 'reset': return modal(`<h2>Lernstand löschen?</h2><p>Gelöscht wird nur der Englisch-Fortschritt auf diesem Gerät. Sterne und Tickets im Flauschi-Konto bleiben.</p><div class="btns"><button class="btn alt" data-act="close">Abbrechen</button><button class="btn warn" data-act="resetok">Ja, löschen</button></div>`);
    case 'resetok': { try { LS.setItem(EN.KEY + '_geloescht_' + EN.today(), JSON.stringify(S)); } catch (x) {} const n = S.name, c = S.char; S = EN.fresh(); S.name = n; S.char = c; save(); closeModal(); window.ENAPP.S = S; toast('Gelöscht.'); return parents(); }
  }
});
document.addEventListener('keydown', e => {
  if (!RUN || !task() || task().kind !== 'write' || $('#modal.on')) return;
  if (e.key === 'Backspace') { e.preventDefault(); typeKey('del'); }
  else if (e.key === 'Enter') typeKey('ok');
  else if (e.key === ' ') { e.preventDefault(); typeKey(' '); }
  else if (/^[a-zA-Z]$/.test(e.key)) typeKey(e.key.toLowerCase());
});
// Übungszeit zählen (nur sichtbar und in einer Übung), alle 10 s speichern
let tick = 0;
setInterval(() => { if (RUN && !RUN.done && document.visibilityState !== 'hidden') { EN.day(S).sec++; if (++tick % 10 === 0) save(); } }, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
if (K) { K.persist(); K.onChange(updateKonto); }
// Neue Kleidung aus dem Laden (anderer Tab): Startbild neu zeichnen
window.addEventListener('storage', e => { if ((e.key === KLAR_KEY || e.key === 'flauschi_konto_v1') && SCREEN === 'home' && !$('#modal.on')) home(); });
// Service Worker (nur Testseite, nicht als Datei)
const PWA = { state: 'aus' };
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.EN_PWA) {
  PWA.state = 'lädt';
  navigator.serviceWorker.register('sw.js').then(() => { PWA.state = 'ok'; }, () => { PWA.state = 'fehler'; });
}

window.ENAPP = { get S() { return S; }, set S(v) { S = v; }, get RUN() { return RUN; }, PWA, home, topic, start, startDaily, startSort, startTest, testGo, parents, typeKey, finish };
who();
// Sobald 3D bereit ist (oder ausfällt): aktuellen Bildschirm neu zeichnen
if (window.K3D) window.K3D.ready.then(() => { if (SCREEN === 'home') home(); else if (SCREEN === 'who') who(true); else if (SCREEN === 'topic' || SCREEN === 'par') { const a = document.querySelector('.scr.on .ava'); if (a) a.innerHTML = fig(me().char, me().wear); } });
})();
</script>
</body>
</html>
