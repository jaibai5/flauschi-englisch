<script>/* Flauschi-Konto v1 – gemeinsames Punktekonto aller Flauschi-Lernapps (Klarinette, Englisch, Mathe, …).
   Vertrag: docs/FLAUSCHI_KONTO.md. Diese Datei wird in jede Lern-App unverändert kopiert (Prüfsumme vergleichen).
   Funktioniert nur, wenn alle Apps unter derselben Herkunft laufen: https://jaibai5.github.io/<app>/
   Lern-Apps rufen nur earn() und setProfile() auf. Ausgeben (spend) darf nur die App mit Laden und Spiel. */
(function (root) {
  'use strict';
  var KEY = 'flauschi_konto_v1', V = 1, LOG_MAX = 300, APP_RE = /^[a-z][a-z0-9-]{1,23}$/;

  function today(d) { d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function int(x) { return Math.max(0, Math.floor(+x || 0)); }
  function fresh() { return { v: V, stars: 0, tix: 0, name: '', char: '', own: [], wear: {}, set: { gameLimit: 5 }, apps: {}, log: [] }; }
  function fill(o) {
    var f = fresh(), k;
    o.stars = int(o.stars); o.tix = int(o.tix);
    for (k in f) if (o[k] === undefined || o[k] === null || typeof o[k] !== typeof f[k] || Array.isArray(o[k]) !== Array.isArray(f[k])) o[k] = f[k];
    o.stars = int(o.stars); o.tix = int(o.tix); o.name = String(o.name).slice(0, 20);
    return o;
  }
  function store() { try { return root.localStorage; } catch (e) { return null; } }
  function read() {
    var ls = store();
    try { var o = JSON.parse((ls && ls.getItem(KEY)) || 'null'); if (o && typeof o === 'object' && !Array.isArray(o) && typeof o.v === 'number') return fill(o); } catch (e) {}
    return fresh();
  }
  function write(o) { var ls = store(); try { if (!ls) return false; ls.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
  function checkApp(app) { if (!APP_RE.test(String(app))) throw new Error('FlauschiKonto: ungültiger App-Name "' + app + '" (klein, z. B. "englisch")'); }
  function book(o, app, stars, tix, why) {
    var a = o.apps[app] || (o.apps[app] = { stars: 0, tix: 0, last: '' });
    if (stars > 0) a.stars += stars; if (tix > 0) a.tix += tix; a.last = today();
    o.log.push({ t: Date.now(), app: app, stars: stars, tix: tix, why: String(why || '').slice(0, 60) });
    if (o.log.length > LOG_MAX) o.log = o.log.slice(-LOG_MAX);
  }

  // Gutschrift für echte Lernleistung. Gibt den neuen Stand zurück.
  function earn(app, stars, tix, why) {
    checkApp(app); stars = int(stars); tix = int(tix);
    var o = read(); if (!stars && !tix) return o;
    o.stars += stars; o.tix += tix; book(o, app, stars, tix, why); write(o); return o;
  }
  // Ausgabe (Laden, Spielrunde). false, wenn nicht genug da ist; dann ändert sich nichts.
  function spend(app, stars, tix, why) {
    checkApp(app); stars = int(stars); tix = int(tix);
    var o = read(); if (o.stars < stars || o.tix < tix) return false;
    o.stars -= stars; o.tix -= tix; book(o, app, -stars, -tix, why); write(o); return o;
  }
  // Name und Figur: leere Werte überschreiben nie vorhandene.
  function setProfile(p) {
    p = p || {}; var o = read();
    if (p.name && String(p.name).trim()) o.name = String(p.name).trim().slice(0, 20);
    if (p.char && String(p.char).trim()) o.char = String(p.char).trim().slice(0, 12);
    write(o); return o;
  }
  // Summe je App in den letzten n Tagen (für Elternbereiche): { klarinette: { stars, tix }, … }
  function week(n) {
    var from = Date.now() - (n || 7) * 864e5, out = {};
    read().log.forEach(function (e) { if (e.t >= from && (e.stars > 0 || e.tix > 0)) { var s = out[e.app] || (out[e.app] = { stars: 0, tix: 0 }); s.stars += Math.max(0, e.stars); s.tix += Math.max(0, e.tix); } });
    return out;
  }

  function persist() { try { if (root.navigator && navigator.storage && navigator.storage.persist) return navigator.storage.persist(); } catch (e) {} return Promise.resolve(false); }

<script>/* Flauschis Englisch · Aussprache und Klänge.
   Weg 1: vorab erzeugte Aufnahmen (voice-data.js, MP3) über WebAudio – geht auf dem Fire HD 8 auch ohne Netz.
   Weg 2: Stimme des Geräts (speechSynthesis, en-GB), nur wenn gewählt oder eine Aufnahme fehlt.

<script>/* Flauschis Englisch · 3D-Grundlage (übernommen aus dem Schwesterprojekt Klarinette, src/k3d.js v0.4; nur Testseite): three.js aus vendor/, Kenney-Modelle (CC0) aus assets/welt.bin.
   - K3D.ready: Promise -> true, wenn 3D läuft (WebGL da, Modelle geladen, nicht abgeschaltet), sonst false (dann bleibt alles 2D).
   - K3D.model(name): Kenney-Modell als Mesh (alle teilen ein Material mit Eckpunktfarben).
   - K3D.char(cid, wear): eigene 3D-Figur (Flauschi, Rex, Finn, Robo) mit Kleidung; fig.pose(t, 'idle'|'run'|'float'|'cheer'|'wave').
   - K3D.live(el, def): eine gemeinsame Bühne (ein WebGL-Renderer), def = { scene, camera, update(dt, t), resize(w, h) }.
   - K3D.snap(cid, wear, w, h, opt): Standbild der Figur als Bild-Adresse (für Übungen, ohne laufende 3D-Grafik).

      if (pref2d() && Q.get('g') !== '3d') return fail('2D gewählt');

  if (Q.get('g') === '2d') return fail('2D per Adresse');
  if (pref2d() && Q.get('g') !== '3d') return fail('2D gewählt');
  try { const c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) return fail('kein WebGL'); } catch (e) { return fail('kein WebGL'); }

  const bl = (t % 4.2) > 4.05; F.eyeM.forEach(e => { e.scale.y = bl ? e.scale.x * 0.15 : e.scale.x; });

  else if (F.FR.children.length && !F.chick) F.FR.position.y = 1.15 + Math.sin(t * 3) * 0.05;
  if (F.chick) F.FR.position.y = 0.78 + B.position.y + Math.abs(Math.sin(t * 3)) * 0.02;
  if (F.fx) F.fx.forEach((s, i) => { const p = (t * 0.3 + s.ph) % 1, a = s.ph * 6.28 + t * 0.6; s.position.set(Math.cos(a) * 0.5, 0.4 + p * 0.9, Math.sin(a) * 0.35); s.material.opacity = Math.sin(p * Math.PI); });
}

/* ---------- Standbild der Figur (eigener kleiner Renderer, Ergebnis wird zwischengespeichert) ---------- */
let SR = null, SS = null, SC = null;

K3D.CHAR_IDS = ['alpaka', 'dino', 'fuchs', 'robo'];
})();

<script>/* Flauschis Englisch · 3D in der App (nur Testseite, wie Klarinette v0.4). Braucht src/k3d.js.
   K3DAPP.home(sec, char, wear, figEl)  Startbildschirm: Figur auf ihrer Insel im Meer (an der Stelle von figEl), Buchstaben schweben
   K3DAPP.img(cid, wear, cls, pose)     Standbild der 3D-Figur (für Leisten, Erststart, Ergebnis)
   K3DAPP.leave()                       laufende 3D-Grafik anhalten (jeder Bildschirmwechsel; Übungen laufen ohne laufende 3D-Grafik)
   Bäume, Blumen, Steine: Kenney Nature Kit (CC0). Figuren: eigene Modelle (k3d.js). Inselbau übernommen aus Klarinette (k3d_app.js). */
(function () {
'use strict';
const K = window.K3D; if (!K) return;
const A = window.K3DAPP = {};
let T = null;
const rnd = seed => () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const lam = {}; const LM = c => lam[c] || (lam[c] = new T.MeshLambertMaterial({ color: new T.Color(c), flatShading: true }));

  const p = g.attributes.position, R = rnd(Math.round(r0 * 1000) + 7), seen = {};
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), k = x.toFixed(3) + ',' + y.toFixed(3) + ',' + z.toFixed(3);
    if (onlyTop && y < 0) continue;
    if (!seen[k]) seen[k] = [(R() - 0.5) * amt, (R() - 0.5) * amt * 0.5, (R() - 0.5) * amt];
    const d = seen[k]; p.setXYZ(i, x + d[0], y + d[1], z + d[2]);

}
function islandBase(r) {

  const rock = new T.Mesh(jitter(new T.CylinderGeometry(r * 1.08, r * 0.55, 1.6, 9, 1), 0.25, r), LM(0x9a8a7a)); rock.position.y = -0.9; g.add(rock);
  const sand = new T.Mesh(jitter(new T.CylinderGeometry(r, r * 1.1, 0.4, 12, 1), 0.18, r + 1), LM(0xf3d9a0)); sand.position.y = -0.08; sand.receiveShadow = true; g.add(sand);
  const gs = new T.Mesh(jitter(new T.CylinderGeometry(r * 0.8, r * 0.8 + 0.08, 0.2, 12, 1), 0.14, r + 2, true), LM(0x86d36a)); gs.position.y = 0.12; gs.receiveShadow = true; g.add(gs);

}
const put = (g, name, x, z, s, ry, y) => { const m = K.model(name, { s: s || 1 }); m.position.set(x, y == null ? g.top : y, z); m.rotation.y = ry || 0; g.add(m); return m; };

    put(g, 'plant_bushDetailed', 1.0, 0.45, 0.9); put(g, 'flower_redA', -0.85, 0.5, 1.6); put(g, 'flower_yellowB', -0.65, 0.75, 1.6, 1); put(g, 'flower_purpleA', 0.7, 0.85, 1.6, 2);
    put(g, 'mushroom_redGroup', -1.15, 0.05, 1.4); put(g, 'rock_smallA', 1.35, 0.1, 1.2, 0, 0.06); put(g, 'sign', 0.55, -0.7, 1.2, -0.5);
  } else {

}
// Schwebende Buchstaben statt Noten (wie die Noten im Klarinetten-Start)
function letters(scene) { const a = []; ['A', 'b', 'C', 'hi!'].forEach((ch, i) => { const s = K.textSprite(ch, { color: ['#ff4f8b', '#7b5cff', '#2fb35a', '#ffb03a'][i], size: 72, h: ch.length > 1 ? 0.3 : 0.34 }); s.ph = i / 4; scene.add(s); a.push(s); }); return a; }

A.home = (sec, cid, wear, figEl, onTap) => {

  const fig = K.char(cid, wear); fig.position.set(0, isl.top, 0.25); fig.rotation.y = -0.9; fig.look = -0.25; scene.add(fig);

  host.addEventListener('pointerdown', tap);
  K.live(host, {
    scene, camera: cam, resize: fit,
    update(dt, t) {
      water.tick(t); boat.position.y = Math.sin(t * 1.3) * 0.04; boat.rotation.z = Math.sin(t * 1.1) * 0.05;
      cl.forEach(c => { c.position.x += c.sp * dt; if (c.position.x > 18) c.position.x = -18; });
      wave -= dt; if (wave < 0) wave = 7 + Math.random() * 4;
      if (jump > 0) { jump -= dt; fig.pose(t, 'cheer'); } else fig.pose(t, wave < 1.6 ? 'wave' : 'idle');
      ls.forEach(s => { const p = (t * 0.2 + s.ph) % 1; s.position.set(0.5 + Math.sin(p * 7 + s.ph * 6) * 0.4, 1.3 + p * 1.6, 0.3); s.material.opacity = Math.sin(p * Math.PI) * 0.9; });
    },
    dispose() { host.removeEventListener('pointerdown', tap); sec.classList.remove('g3d'); }

};
A.img = (cid, wear, cls, pose) => `<img class="${cls || 'f3d'}" alt="" draggable="false" src="${K.snap(cid, wear, 300, 330, pose ? { pose, t: 0.26 } : undefined)}">`;
A.leave = () => { K.stopLive(); };
})();
</script>
<script>/* Flauschis Englisch · Oberfläche. Braucht EN (logic.js), EN_PICS, ENDRAW, ENAUDIO, optional FlauschiKonto.
   Bildschirme: who (Erststart), home, topic, ex (Übung), par (Eltern). Ergebnis und Fenster im #modal.
   Für Tests: window.ENAPP. */
(function () {
'use strict';
const EN = window.EN, P = window.EN_PICS, DR = window.ENDRAW, AU = window.ENAUDIO, K = window.FlauschiKonto || null, META = window.EN_META || {};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let LS; try { LS = window.localStorage; LS.getItem('x'); } catch (e) { const m = {}; LS = { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }
let S = EN.load(LS);
const save = () => EN.save(LS, S);
let RUN = null;           // laufende Übung
let busy = false;         // während Rückmeldung keine Eingaben

// ---------- Hilfen ----------
const ic = n => P.icon(n);
const starsHTML = (n, max) => '<span class="stars">' + Array.from({ length: max || 3 }, (_, i) => `<span class="${i < n ? '' : 'off'}">${ic('star')}</span>`).join('') + '</span>';
function show(id) { if (window.K3DAPP) window.K3DAPP.leave(); SCREEN = id; document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }
function toast(t, ms) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), ms || 1800); }
function modal(html) { const m = $('#modal'); m.innerHTML = '<div class="box">' + html + '</div>'; m.classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
const konto = () => K ? K.read() : { stars: 0, tix: 0, name: '', char: '', wear: {} };
const me = () => { const k = konto(); return { name: k.name || S.name || '', char: k.char || S.char || 'alpaka', wear: k.wear || {} }; };
// 3D wie Klarinette (nur Testseite): Figuren als 3D-Standbild, Start lebt in 3D. 2D-Zeichnung nur als Notlösung (kein WebGL, Datei-Version, „Grafik: einfach“).
const G3D = () => !!(window.K3D && window.K3D.ok && window.K3DAPP);
const P3D = () => !!(window.K3D && !window.K3D.ok && !window.K3D.failed);   // 3D lädt noch: nichts zeigen statt 2D, sonst springt das Bild
let SCREEN = '';
const fig = (cid, wear, cls, pose) => P3D() ? `<div class="ph3d ${cls || ''}"></div>` : G3D() ? window.K3DAPP.img(cid, wear || {}, 'f3d ' + (cls || ''), pose) : DR.charSVG(cid, wear || {}, cls || 'chr');
const ava = cls => `<span class="${cls || 'ava'}">${fig(me().char, me().wear, '', '')}</span>`;
const topicOf = id => EN.TOPICS.find(t => t.id === id);
const catOf = id => EN.CATS.find(c => c.id === id);
// Flauschi Land (gleiche Adresse jaibai5.github.io = gleiches Konto). Nur auf der Testseite, in der Datei-Version führt der Link ins Leere.
const landURL = () => (META.land && /^https?:$/.test(location.protocol)) ? META.land : '';
AU.setMode(S.set.voice);

// ---------- Erststart ----------
function who(edit) {
  const k = konto();
  if (!edit && (k.name || S.name)) {
    if (!S.name) { S.name = k.name; S.char = k.char || 'alpaka'; save(); }
    else if (K && !k.name) K.setProfile({ name: S.name, char: S.char });
    return home();
  }
  let sel = me().char;
  const el = $('#who');
  el.innerHTML = `<div class="body" style="align-items:center;justify-content:center;text-align:center">
    <h1 style="margin:0">Hallo! Ich bin Flauschi. Wer bist du?</h1>
    <div class="chars">${DR.CHARS.map(c => `<button data-act="pickchar" data-id="${c.id}" class="${c.id === sel ? 'sel' : ''}">${fig(c.id, {})}<div><b>${c.n}</b></div></button>`).join('')}</div>
    <div>Wie heißt du? <input id="nameI" class="inp" maxlength="20" value="${esc(me().name)}" autocomplete="off"></div>
    <button class="btn" data-act="namesave">Los geht's!</button></div>`;
  el.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'pickchar') { sel = b.dataset.id; el.querySelectorAll('.chars button').forEach(x => x.classList.toggle('sel', x === b)); }
    if (b.dataset.act === 'namesave') {
      const n = $('#nameI').value.replace(/[<>]/g, '').trim().slice(0, 20);
      if (!n) { toast('Schreib deinen Namen.'); return; }
      S.name = n; S.char = sel; save();
      if (K) K.setProfile({ name: n, char: sel });
      home();
    }
  };
  show('who');
}

// ---------- Start ----------
function bar(title, back) {
  const k = konto();
  return `<div class="bar">${back ? `<button class="ib" data-act="${back}" aria-label="Zurück">${ic('home')}</button>` : ava()}
    <h1>${title}</h1>
    <span class="chip">${ic('star')}<span id="kStars">${k.stars}</span></span>
    <span class="chip">${ic('ticket')}<span id="kTix">${k.tix}</span></span></div>`;
}
function home() {
  RUN = null; closeModal();
  const el = $('#home');
  const nm = me().name;
  el.innerHTML = `<div class="hwrap"><div class="hfig" id="hFig">${fig(me().char, me().wear)}<div class="hname">${esc(nm)}</div></div><div class="menu">
    <div class="hbar"><h1>Hallo ${esc(nm)}! Let's learn English!</h1><span class="chip">${ic('star')}<span id="kStars">${konto().stars}</span></span><span class="chip">${ic('ticket')}<span id="kTix">${konto().tix}</span></span></div>
    <div class="row">
      <button class="big main" data-act="daily">${ic('today')}<span>Heute üben<small>Flauschi sucht die Wörter aus</small></span></button>
      <button class="big" data-act="sortall">${ic('sort')}<span>Sortieren<small>Wörter in Gruppen ordnen</small></span></button>
      <button class="big" data-act="test">${ic('test')}<span>Test wie in der Schule<small>12 Aufgaben, Ergebnis für Eltern</small></span></button>
    </div>
    <div class="grid">${EN.TOPICS.map(t => {
      const o = EN.wordsOf(t.id), sitzt = o.filter(w => EN.status(S, w.id) === 'sitzt').length;
      return `<button class="card" data-act="topic" data-id="${t.id}"><span class="pic">${P.svg(t.pic)}</span><b>${t.en}</b><small>${t.de} · Seite ${t.page}</small>
        <span class="prog"><i style="width:${Math.round(100 * sitzt / o.length)}%"></i></span><small>${sitzt} von ${o.length} sitzen</small></button>`;
    }).join('')}</div>
    <div class="row" style="flex:0 0 auto;justify-content:space-between;align-items:center">
      <button class="btn alt" data-act="par">${'Eltern'}</button>
      ${landURL() ? `<a class="btn land" id="hLand" href="${esc(landURL())}">${ic('land')}<span>Flauschi Land<small>Tickets einlösen</small></span></a>` : `<span style="opacity:.75;font-size:.9em">${K ? 'Sterne und Tickets kommen ins Flauschi-Konto für Flauschi Land.' : ''}</span>`}
      <button class="btn alt" data-act="who">Figur und Name</button>
    </div></div></div>
    <button class="ver" id="hVer" data-act="about">v${esc(META.version || '0')} · ${esc(META.built || '')}</button>`;
  show('home');
  if (G3D()) window.K3DAPP.home(el, me().char, me().wear, $('#hFig'), () => AU.say('Hello!'));
}

// ---------- Thema ----------
function topic(id) {
  RUN = null; closeModal();
  const t = topicOf(id), el = $('#topic'), sortable = !!EN.sortRound(S, [id], () => 0.5);
  const exs = EN.EX.concat(sortable ? [{ id: 'sort', de: 'Sortieren', icon: 'sort', scored: true, info: 'Ordne die Wörter in Gruppen' }] : []);
  el.innerHTML = bar(`${t.en} <small style="font-weight:400;font-size:.65em">${t.de} · Heft Seite ${t.page}</small>`, 'home') + `<div class="body"><div class="tw">
    <div class="words">${EN.wordsOf(id).map(w => `<button class="wchip ${EN.status(S, w.id)}" data-act="hear" data-id="${w.id}">${P.svg(w.id)}${esc(w.en)}</button>`).join('')}</div>
    <div class="exg">${exs.map(x => `<button class="big" data-act="start" data-ex="${x.id}" data-topic="${id}">${ic(x.icon)}<span>${x.de}<small>${x.info}</small>${x.scored ? starsHTML(S.best[id + ':' + x.id] || 0) : ''}</span></button>`).join('')}</div>
  </div></div>`;
  show('topic');
}

// ---------- Übung: Ablauf ----------
// RUN: { key, mode: practice|test, tasks: [{id, kind, cats?}], i, ok, n, res: [], retry: Set, t0 }
function startRun(key, tasks, opts) {
  opts = opts || {};
  RUN = { key, title: opts.title || '', mode: opts.mode || 'practice', tasks, i: 0, ok: 0, n: tasks.length, res: [], back: opts.back || 'home', topic: opts.topic, daily: !!opts.daily, scored: opts.scored !== false, requeued: {} };
  show('ex'); renderTask();
}
function start(topicId, ex) {
  if (ex === 'sort') return startSort([topicId], topicId + ':sort', 'topic');
  const t = topicOf(topicId), words = EN.round(S, topicId, ex);
  const x = EN.exOf(ex);
  startRun(topicId + ':' + ex, words.map(w => ({ id: w.id, kind: ex })), { title: `${t.en} · ${x.de}`, back: 'topic', topic: topicId, scored: x.scored });
}
function startDaily() { startRun('daily', EN.daily(S), { title: 'Heute üben', daily: true }); }
function startSort(topics, key, back) {
  const r = EN.sortRound(S, topics);
  startRun(key, r.items.map(id => ({ id, kind: 'sort', cats: r.cats })), { title: 'Sortieren', back: back || 'home', topic: topics.length === 1 ? topics[0] : null });
}
function startTest() {
  modal(`<h2>Test wie in der Schule</h2><p>Welche Themen kommen dran?</p>
    <div class="set" style="justify-content:center">${EN.TOPICS.map(t => `<label class="btn alt" style="display:inline-flex;gap:.4em;align-items:center"><input type="checkbox" value="${t.id}" checked style="width:1.4em;height:1.4em"> ${t.en}</label>`).join('')}</div>
    <p style="opacity:.75">Im Test gibt es keine Tipps. Am Ende siehst du alles.</p>
    <div class="btns"><button class="btn alt" data-act="close">Zurück</button><button class="btn" data-act="testgo">Test starten</button></div>`);
}
function testGo() {
  const topics = [...document.querySelectorAll('#modal input:checked')].map(i => i.value);
  if (!topics.length) { toast('Wähle mindestens ein Thema.'); return; }
  closeModal();
  const tasks = EN.testTasks(S, topics).map(t => t.kind === 'sort' ? Object.assign(t, { cats: EN.catChoices(t.id) }) : t);
  startRun('test', tasks, { title: 'Test', mode: 'test' });
}
const task = () => RUN && RUN.tasks[RUN.i];

function exBar() {
  const dots = RUN.tasks.slice(0, RUN.n).map((t, i) => `<i class="${i < RUN.res.length ? (RUN.res[i].ok ? 'ok' : 'bad') : i === RUN.i ? 'cur' : ''}"></i>`).join('');
  return `<div class="bar"><button class="ib" data-act="quit" aria-label="Beenden">✕</button><h1 style="flex:0 1 auto">${esc(RUN.title)}</h1><div class="dots">${RUN.mode === 'learn' ? '' : dots}</div>
    <span class="chip">${RUN.i + 1}/${RUN.tasks.length}</span></div>`;
}
function renderTask() {
  busy = false;
  const t = task(); if (!t) return finish();
  const w = EN.word(t.id), el = $('#ex');
  RUN.first = true; RUN.tries = 0;
  const kind = t.kind;
  let body = '';
  const sayBtn = (cls) => `<button class="say ${cls || ''}" data-act="say" data-t="${esc(w.en)}">${ic('speaker')}<span>Hören</span></button>`;
  const left = (opts) => `<div class="left"><span class="pic">${P.svg(w.id)}</span>${opts.de ? `<span class="de">${esc(w.de)}</span>` : ''}${opts.say ? sayBtn() : ''}</div>`;
  if (kind === 'learn') {
    body = `<div class="lcard"><span class="pic">${P.svg(w.id)}</span><div><div class="en">${esc(w.en)}</div><div class="de">${esc(w.de)}</div>${sayBtn('huge')}
      <p style="opacity:.8">Hör zu und sprich nach!</p></div></div>
      <div style="display:flex;flex-direction:column;justify-content:center;gap:2vh"><button class="btn" data-act="next">Weiter ›</button>${RUN.i > 0 ? '<button class="btn alt" data-act="prev">‹ Zurück</button>' : ''}</div>`;
  } else if (kind === 'pic') {
    RUN.opts = EN.choices(w, 4);
    body = left({}) + `<div class="right"><div class="prompt">Welches Wort passt zum Bild?</div><div class="opts">${RUN.opts.map(o => `<button class="opt" data-act="pick" data-v="${o.id}">${esc(o.en)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
  } else if (kind === 'listen') {
    RUN.opts = EN.choices(w, 4);
    body = `<div class="left">${sayBtn('huge')}<div class="prompt">Hör zu! Welches Bild ist es?</div></div>
      <div class="right"><div class="opts">${RUN.opts.map(o => `<button class="opt picopt" data-act="pick" data-v="${o.id}" aria-label="Bild">${P.svg(o.id)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
  } else if (kind === 'puzzle') {
    RUN.tiles = EN.tiles(w.en); RUN.pos = 0;
    body = left({ de: S.set.de, say: true }) + `<div class="right"><div class="prompt">Lege das Wort!</div><div class="slots" id="slots">${slotsHTML(w.en, '')}</div>
      <div class="tiles">${RUN.tiles.map((c, i) => `<button class="tile" data-act="tile" data-i="${i}">${esc(c)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
  } else if (kind === 'write') {
    RUN.typed = ''; RUN.phase = 'try';
    body = left({ de: S.set.de || RUN.mode === 'test', say: true }) + `<div class="right" id="wr">${writeHTML(w)}</div>`;
  } else if (kind === 'pen') {
    RUN.phase = 'draw';
    body = left({ de: S.set.de, say: true }) + `<div class="right"><div class="prompt" id="penP">Schreib das Wort mit dem Stift!</div><div class="pad" id="pad"><canvas id="cv"></canvas><div class="sol" id="sol"></div></div>
      <div class="row" id="penB" style="justify-content:center"><button class="btn alt" data-act="penclear">Löschen</button><button class="btn" data-act="pendone">Fertig – zeig mir das Wort</button></div></div>`;
  } else if (kind === 'sort') {
    body = `<div class="sortw"><div class="prompt">${RUN.mode === 'test' ? 'Zu welcher Gruppe gehört das Wort?' : 'Wohin gehört das Wort?'}</div>
      <div class="sword">${esc(w.en)} <button class="say" data-act="say" data-t="${esc(w.en)}">${ic('speaker')}</button></div>
      <div class="baskets">${t.cats.map(c => `<button class="basket" data-act="cat" data-v="${c}"><b>${catOf(c).en}</b><small>${catOf(c).de}</small><div class="in">${RUN.mode === 'test' ? '' : (RUN.placed && RUN.placed[c] || []).map(x => `<span>${esc(EN.word(x).en)}</span>`).join('')}</div></button>`).join('')}</div>
      <div class="fb" id="fb"></div></div>`;
  }
  el.innerHTML = exBar() + `<div id="exB">${body}</div>`;
  if (kind === 'pen') setupPad();
  // Wort vorsprechen, wo es hilft (nicht bei Bild → Wort und nicht im Test-Schreiben: dort ist Hören freiwillig)
  if (kind === 'listen' || kind === 'learn' || (kind === 'puzzle') || (kind === 'sort' && RUN.mode !== 'test')) setTimeout(() => { if (task() === t) AU.say(w.en); }, 250);
}
function slotsHTML(target, typed, marks) {
  let k = 0, out = '';
  const n = target.replace(/ /g, '').length + target.split(' ').length * 0.5, wv = Math.min(6.6, 92 / n);   // lange Wörter: schmalere Kästchen, eine Zeile
  for (const ch of target) {
    if (ch === ' ') { out += '<span class="gap"></span>'; continue; }
    const c = typed[k] || '', m = marks ? marks[k] : '';
    out += `<span class="${k === typed.length ? 'cur' : ''} ${m || ''}" style="width:${wv.toFixed(2)}vh">${esc(c)}</span>`; k++;
  }
  return out;
}

// ---------- Auswahl (Bild, Hören, Sortieren) ----------
async function pick(btn) {
  if (busy) return;
  const t = task(), w = EN.word(t.id), v = btn.dataset.v, ok = t.kind === 'sort' ? v === w.cat : v === t.id;
  if (RUN.mode === 'test') {
    busy = true; btn.classList.add('sel');
    record(ok, t.kind === 'sort' ? catOf(v).en : EN.word(v).en); await sleep(350); return next();
  }
  if (ok) {
    busy = true; btn.classList.add('good'); AU.tone('ok');
    const fb = $('#fb'); if (fb) { fb.className = 'fb ok'; fb.textContent = RUN.first ? EN.PRAISE[Math.floor(Math.random() * EN.PRAISE.length)] : 'Jetzt stimmt es!'; }
    if (t.kind === 'sort') { RUN.placed = RUN.placed || {}; (RUN.placed[v] = RUN.placed[v] || []).push(t.id); const inn = btn.querySelector('.in'); if (inn) inn.insertAdjacentHTML('beforeend', `<span>${esc(w.en)}</span>`); }
    if (RUN.first) record(true);
    await (t.kind === 'pic' ? AU.say(w.en) : sleep(500)); await sleep(350);
    next();
  } else {
    btn.classList.add('no'); btn.disabled = true; AU.tone('bad');
    if (RUN.first) { record(false); requeue(t); }
    RUN.first = false;
    const fb = $('#fb');
    if (fb) { fb.className = 'fb bad'; fb.textContent = t.kind === 'listen' ? 'Hör noch einmal genau hin.' : t.kind === 'sort' ? `${w.en} heißt „${w.de}“. Wo passt das hin?` : `Das ist ${EN.word(v).en}. Versuch es noch einmal.`; }
    if (t.kind === 'listen') setTimeout(() => AU.say(w.en), 400);
  }
}
// Ergebnis der ersten Antwort festhalten und Lernstand buchen
function record(ok, answer) {
  const t = task(); if (RUN.res.length > RUN.i || RUN.i >= RUN.n) return;   // Wiederholungen zählen nicht
  RUN.res.push({ id: t.id, kind: t.kind, ok, answer: answer || '' });
  if (ok) RUN.ok++;
  EN.mark(S, t.id, t.kind === 'write' ? 'w' : t.kind === 'pen' ? 'p' : 'c', ok);
  save();
}
// Falsches Wort kommt am Ende der Runde noch einmal (ohne Wertung)
function requeue(t) { if (RUN.mode === 'test' || RUN.requeued[t.id] || RUN.i >= RUN.n) return; RUN.requeued[t.id] = 1; RUN.tasks.push({ id: t.id, kind: t.kind, cats: t.cats }); }
function next() { RUN.i++; renderTask(); }

// ---------- Buchstaben legen ----------
function tile(btn) {
  if (busy) return;
  const t = task(), w = EN.word(t.id), target = EN.norm(w.en).replace(/ /g, ''), c = RUN.tiles[+btn.dataset.i];
  if (c === target[RUN.pos]) {
    btn.classList.add('used'); RUN.pos++;
    $('#slots').innerHTML = slotsHTML(EN.norm(w.en), target.slice(0, RUN.pos));
    if (RUN.pos === target.length) {
      busy = true; AU.tone('ok'); if (RUN.first) record(true);
      const fb = $('#fb'); fb.className = 'fb ok'; fb.textContent = RUN.first ? EN.PRAISE[Math.floor(Math.random() * EN.PRAISE.length)] : 'Geschafft!';
      AU.say(w.en).then(() => sleep(400)).then(next);
    }
  } else {
    btn.classList.remove('no'); void btn.offsetWidth; btn.classList.add('no'); AU.tone('bad');
    if (RUN.first) { record(false); requeue(t); }
    RUN.first = false; RUN.tries++;
    const fb = $('#fb'); fb.className = 'fb bad';
    fb.textContent = RUN.tries >= 2 ? `Der nächste Buchstabe ist „${target[RUN.pos]}“.` : 'Der passt hier noch nicht.';
  }
}

// ---------- Schreiben ----------
const ROWS = ['abcdefghi', 'jklmnopqr', 'stuvwxyz'];
function writeHTML(w) {
  const test = RUN.mode === 'test', ph = RUN.phase;
  let top = '';
  if (ph === 'study') {
    const d = EN.diff(RUN.typed, w.en);
    top = `<div class="prompt">${esc(EN.hint(RUN.typed, w.en))}</div>
      <div class="cmp you">Du: ${d.input.map(x => `<span class="${x.ok ? '' : 'm'}">${x.ch === ' ' ? '&nbsp;' : esc(x.ch)}</span>`).join('') || '–'}</div>
      <div class="cmp">${d.target.map(x => `<span class="${x.ok ? '' : 'm'}">${x.ch === ' ' ? '&nbsp;' : esc(x.ch)}</span>`).join('')}</div>
      <p style="text-align:center">Schau genau hin, sprich es leise. Dann deck es zu und schreib es selbst.</p>
      <div style="text-align:center"><button class="btn" data-act="cover">Zudecken und schreiben</button></div>`;
    return top;
  }
  const label = ph === 'copy' ? `Schreib ab: <b style="font-size:1.3em;letter-spacing:.06em">${esc(w.en)}</b>` : ph === 'again' ? 'Jetzt du! Schreib es aus dem Kopf.' : test ? 'Schreib das Wort auf Englisch.' : 'Schreib das Wort auf Englisch.';
  top = `<div class="prompt">${label}</div>` + (test ? `<div class="line" id="line">${esc(RUN.typed)}<span style="opacity:.4">|</span></div>` : `<div class="slots" id="slots">${slotsHTML(EN.norm(w.en), RUN.typed)}</div>`) + '<div class="fb" id="fb"></div>';
  const kb = `<div class="kb">${ROWS.map(r => `<div class="kr">${[...r].map(c => `<button class="key" data-act="key" data-k="${c}">${c}</button>`).join('')}</div>`).join('')}
    <div class="kr"><button class="key del" data-act="key" data-k="del" aria-label="Löschen">⌫</button><button class="key wide" data-act="key" data-k=" ">Leertaste</button><button class="key go" data-act="key" data-k="ok">Fertig ✓</button></div></div>`;
  return top + kb;
}
function typeKey(k) {
  if (busy || !RUN) return;
  const t = task(); if (!t || t.kind !== 'write' || RUN.phase === 'study') return;
  const w = EN.word(t.id), max = RUN.mode === 'test' ? 30 : EN.norm(w.en).replace(/ /g, '').length;
  if (k === 'del') RUN.typed = RUN.typed.slice(0, -1);
  else if (k === 'ok') return submitWrite();
  else if (k === ' ') { if (RUN.mode === 'test' && RUN.typed && !RUN.typed.endsWith(' ')) RUN.typed += ' '; }
  else if (/^[a-z]$/.test(k) && RUN.typed.replace(/ /g, '').length < max) RUN.typed += k;
  if (RUN.mode === 'test') $('#line').innerHTML = esc(RUN.typed) + '<span style="opacity:.4">|</span>';
  else { $('#slots').innerHTML = slotsHTML(EN.norm(w.en), RUN.typed); if (RUN.typed.replace(/ /g, '').length === max) { const tok = RUN.tok = (RUN.tok || 0) + 1; setTimeout(() => { if (RUN && RUN.tok === tok && task() === t && !busy && RUN.phase !== 'study') submitWrite(); }, 350); } }
}
// In der Übung tippt das Kind nur Buchstaben; Leerzeichen setzt die Lückenanzeige. Verglichen wird ohne Leerzeichen-Fehler.
function typedWord(w) {
  if (RUN.mode === 'test') return RUN.typed;
  let k = 0, out = ''; for (const ch of EN.norm(w.en)) { if (ch === ' ') out += ' '; else out += RUN.typed[k++] || ''; }
  return out.trim();
}
async function submitWrite() {
  if (!RUN || RUN.phase === 'study') return;
  RUN.tok = (RUN.tok || 0) + 1;
  const t = task(), w = EN.word(t.id), input = typedWord(w), ok = EN.check(input, w.en);
  if (!EN.norm(input)) { const fb = $('#fb'); if (fb) { fb.className = 'fb bad'; fb.textContent = 'Schreib zuerst das Wort.'; } return; }
  if (RUN.mode === 'test') { busy = true; record(ok, input); await sleep(250); return next(); }
  if (ok) {
    busy = true; AU.tone('ok');
    if (RUN.phase === 'try') record(true);
    const fb = $('#fb'); fb.className = 'fb ok'; fb.textContent = RUN.phase === 'try' ? EN.PRAISE[Math.floor(Math.random() * EN.PRAISE.length)] + ' Richtig geschrieben!' : 'Super, jetzt sitzt es besser!';
    if (!/^(test)$/.test(RUN.mode)) $('#slots').innerHTML = slotsHTML(EN.norm(w.en), RUN.typed, [...RUN.typed].map(() => 'ok'));
    await AU.say(w.en); await sleep(500); return next();
  }
  AU.tone('bad');
  if (RUN.phase === 'try') {
    // Schauen – sprechen – zudecken – schreiben – prüfen
    record(false); requeue(t); RUN.phase = 'study'; RUN.typed = input;
    $('#wr').innerHTML = writeHTML(w); AU.say(w.en);
    return;
  }
  RUN.phase = 'copy'; RUN.typed = '';
  $('#wr').innerHTML = writeHTML(w);
  const fb = $('#fb'); fb.className = 'fb bad'; fb.textContent = 'Noch nicht ganz. Schreib es ab, Buchstabe für Buchstabe.';
}
function cover() { RUN.phase = 'again'; RUN.typed = ''; $('#wr').innerHTML = writeHTML(EN.word(task().id)); }

// ---------- Stift ----------
function setupPad() {
  const cv = $('#cv'), pad = $('#pad'), r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(10, r.width * dpr); cv.height = Math.max(10, r.height * dpr);
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const lines = () => { g.strokeStyle = '#d9ccff'; g.lineWidth = 2; [0.42, 0.62, 0.82].forEach((y, i) => { g.setLineDash(i === 1 ? [8, 8] : []); g.beginPath(); g.moveTo(10, r.height * y); g.lineTo(r.width - 10, r.height * y); g.stroke(); }); g.setLineDash([]); };
  lines(); RUN.padClear = () => { g.clearRect(0, 0, r.width, r.height); lines(); };
  let down = false, last = null;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { down = true; last = pt(e); try { cv.setPointerCapture(e.pointerId); } catch (x) {} };
  cv.onpointermove = e => { if (!down) return; const p = pt(e); g.strokeStyle = '#3d2f4f'; g.lineWidth = e.pointerType === 'pen' ? 3.2 : 4.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p; RUN.drawn = true; };
  cv.onpointerup = cv.onpointercancel = () => { down = false; };
}
function penDone() {
  const w = EN.word(task().id);
  $('#sol').textContent = w.en; AU.say(w.en);
  $('#penP').textContent = 'Vergleiche genau: Hast du jeden Buchstaben richtig?';
  $('#penB').innerHTML = '<button class="btn alt" data-act="penself" data-v="0">Noch üben</button><button class="btn" data-act="penself" data-v="1">Alles richtig ✓</button>';
}
async function penSelf(ok) { record(ok); if (!ok) requeue(task()); AU.tone(ok ? 'ok' : 'bad'); await sleep(300); next(); }

// ---------- Ende der Runde ----------
function finish() {
  const n = RUN.n, ok = RUN.ok, isLearn = RUN.tasks[0] && RUN.tasks[0].kind === 'learn';
  if (isLearn) { toast('Super! Jetzt kennst du die Wörter.'); return RUN.back === 'topic' ? topic(RUN.topic) : home(); }
  const stars = EN.starsFor(ok, n);
  let r = { stars: 0, tix: 0 };
  if (RUN.scored) {
    r = EN.reward(S, RUN.key, stars, { daily: RUN.daily });
    if (K && (r.stars || r.tix)) K.earn(EN.APP, r.stars, r.tix, (RUN.title || RUN.key).slice(0, 60));
  }
  if (RUN.mode === 'test') { S.tests.unshift({ t: Date.now(), ok, n, wrong: RUN.res.filter(x => !x.ok).map(x => x.id) }); S.tests = S.tests.slice(0, 30); }
  save(); AU.tone(stars >= 2 ? 'win' : 'ok');
  const pct = Math.round(100 * ok / n);
  const say = stars === 3 ? 'Fantastisch!' : stars === 2 ? 'Toll gemacht!' : stars === 1 ? 'Gut, weiter so!' : 'Üben lohnt sich – gleich noch einmal?';
  const earn = r.stars || r.tix ? `<div class="earn">Ins Flauschi-Konto: ${r.stars ? '+' + r.stars + ' ' + ic('star') : ''} ${r.tix ? '+' + r.tix + ' ' + ic('ticket') : ''}</div>` : (RUN.scored && stars < 2 ? '<div class="earn" style="color:#7a6a8a">Ab 2 Sternen gibt es Belohnungen.</div>' : '');
  let list = '';
  if (RUN.mode === 'test') list = `<div class="tlist">${RUN.res.map(x => { const w = EN.word(x.id); return `<span class="${x.ok ? 'v' : 'x'}">${x.ok ? '✓' : '✗'}</span><span>${x.kind === 'write' ? esc(w.de) : x.kind === 'sort' ? esc(w.en) + ' → ' + esc(catOf(w.cat).en) : 'Bild: ' + esc(w.de)}</span><span><b>${esc(w.en)}</b>${!x.ok && x.answer ? ` <span style="opacity:.7">(du: ${esc(x.answer)})</span>` : ''}</span>`; }).join('')}</div>`;
  else { const bad = RUN.res.filter(x => !x.ok).map(x => EN.word(x.id).en); if (bad.length) list = `<p>Noch üben: <b>${bad.map(esc).join(', ')}</b></p>`; }
  modal(`<div class="rfig">${fig(me().char, me().wear, '', stars >= 2 ? 'cheer' : 'wave')}</div><h2>${say}</h2>${starsHTML(stars)}<p>${ok} von ${n} richtig (${pct} %)</p>${earn}${list}
    <div class="btns"><button class="btn alt" data-act="resback">Fertig</button><button class="btn" data-act="again">Nochmal</button></div>`);
  RUN.done = true; updateKonto();
}
function again() {
  const r = RUN; closeModal();
  if (r.key === 'daily') return startDaily();
  if (r.key === 'test') return startTest();
  if (r.key === 'sort') return startSort(EN.TOPICS.map(t => t.id), 'sort', 'home');
  const [tp, ex] = r.key.split(':'); start(tp, ex);
}
function updateKonto() { const k = konto(); const a = $('.scr.on #kStars'), b = $('.scr.on #kTix'); if (a) a.textContent = k.stars; if (b) b.textContent = k.tix; }

// ---------- Eltern ----------
function parentsGate() {
  const a = 3 + Math.floor(Math.random() * 6), b = 3 + Math.floor(Math.random() * 6), right = a * b;
  const opts = EN.shuffle([right, right + a, right - b, right + 2].filter((v, i, s) => s.indexOf(v) === i));
  modal(`<h2>Elternbereich</h2><p>Bitte rechnen: <b>${a} × ${b}</b></p><div class="gate">${opts.map(v => `<button class="btn alt" data-act="gate" data-v="${v}" data-ok="${v === right ? 1 : 0}">${v}</button>`).join('')}</div>
    <div class="btns"><button class="btn alt" data-act="close">Zurück</button></div>`);
}
const mm = s => s < 60 ? Math.round(s) + ' s' : Math.round(s / 60) + ' min';
function parents() {
  closeModal();
  const o = EN.overview(S), d = EN.day(S), el = $('#par'), k = konto(), wk = K ? K.week(7) : {};
  const chip = id => { const w = EN.word(id), r = S.words[id]; return `<span class="wchip ${EN.status(S, id)}" title="">${esc(w.en)} <small style="font-weight:400">(${esc(w.de)}${r ? `, schreiben ${r.w[0]}✓ ${r.w[1]}✗` : ''})</small></span>`; };
  const group = (key, title) => `<h3 style="margin:1.4vh 0 .6vh">${title} (${o.by[key].length})</h3><div class="words" style="flex:none;padding:0;background:none">${o.by[key].map(chip).join('') || '<span style="opacity:.6">–</span>'}</div>`;
  const ai = AU.info();
  el.innerHTML = bar('Elternbereich', 'home') + `<div class="pbody">
    <div class="kpis"><div class="kpi">Übungszeit heute<b>${mm(o.todaySec)}</b></div><div class="kpi">Letzte 7 Tage<b>${mm(o.week)}</b></div><div class="kpi">Runden heute<b>${d.rounds}</b></div>
      <div class="kpi">Englisch-Sterne heute<b>${d.stars} / ${EN.DAY_MAX.stars}</b></div><div class="kpi">Wörter sitzen<b>${o.by.sitzt.length} / ${EN.WORDS.length}</b></div></div>
    <h2>Themen (Heft Sally 3, Seiten 3–7)</h2>
    <table><tr><th>Thema</th><th>Seite</th><th>sitzen</th><th>noch nie geübt</th><th>Bestwerte (Bild · Hören · Legen · Schreiben)</th></tr>
      ${o.topics.map(t => { const tp = topicOf(t.id); return `<tr><td>${tp.en} – ${tp.de}</td><td>${tp.page}</td><td>${t.sitzt} / ${t.n}</td><td>${t.neu}</td><td>${['pic', 'listen', 'puzzle', 'write'].map(x => (S.best[t.id + ':' + x] || 0) + '★').join(' · ')}</td></tr>`; }).join('')}</table>
    <h2>Wörter</h2>
    <div class="legend"><span class="wchip sitzt">sitzt: 3× hintereinander richtig geschrieben</span><span class="wchip übt">übt</span><span class="wchip schwierig">schwierig: öfter falsch</span><span class="wchip">neu: noch nie geübt</span></div>
    ${group('schwierig', 'Schwierig')}${group('übt', 'Übt noch')}${group('sitzt', 'Sitzt')}${group('neu', 'Neu')}
    <h2>Tests</h2>
    ${S.tests.length ? `<table><tr><th>Datum</th><th>Ergebnis</th><th>Falsch</th></tr>${S.tests.slice(0, 10).map(t => `<tr><td>${new Date(t.t).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' })}</td><td>${t.ok} / ${t.n} (${Math.round(100 * t.ok / t.n)} %)</td><td>${t.wrong.map(id => esc(EN.word(id).en)).join(', ') || '–'}</td></tr>`).join('')}</table>` : '<p>Noch kein Test gemacht.</p>'}
    <h2>Flauschi-Konto</h2>
    <p>${K ? `Gesamt: ${k.stars} Sterne, ${k.tix} Tickets. Letzte 7 Tage: ${Object.keys(wk).map(a => `${esc(a)} +${wk[a].stars}★ +${wk[a].tix}🎟`).join(', ') || 'keine Gutschriften'}.` : 'Konto nicht geladen.'}<br>
      <small>Regel: neue Sterne nur über den Bestwert einer Übung, 1 Ticket wenn eine Übung zum ersten Mal ≥ 2 Sterne hat, bis zu 3 Fleißsterne am Tag. Höchstens ${EN.DAY_MAX.stars} Sterne und ${EN.DAY_MAX.tix} Tickets pro Tag aus Englisch. Ausgegeben wird in Flauschi Land.</small></p>
    <h2>Einstellungen</h2>
    <div class="set">Aussprache: ${[['auto', 'Aufnahmen (empfohlen)'], ['tts', 'Stimme des Geräts'], ['off', 'aus']].map(([v, n]) => `<button class="btn alt ${S.set.voice === v ? 'sel' : ''}" data-act="voice" data-v="${v}">${n}</button>`).join('')}
      <button class="btn" data-act="say" data-t="pencil sharpener">Testen: „pencil sharpener“</button></div>
    <div class="set">Deutsches Wort beim Schreiben zeigen: ${[[true, 'ja'], [false, 'nein (schwerer)']].map(([v, n]) => `<button class="btn alt ${S.set.de === v ? 'sel' : ''}" data-act="setde" data-v="${v ? 1 : 0}">${n}</button>`).join('')}</div>
    <div class="set">Grafik: ${[['3d', '3D (empfohlen)'], ['2d', 'einfach (falls das Tablet ruckelt)']].map(([v, n]) => `<button class="btn alt ${S.set.gfx === v ? 'sel' : ''}" data-act="gfx" data-v="${v}">${n}</button>`).join('')}
      <small>${G3D() ? '3D läuft' + (window.K3D.low ? ' (Auflösung automatisch gesenkt)' : '') : window.K3D && window.K3D.failed ? 'einfach (' + esc(window.K3D.err) + ')' : window.K3D ? '3D lädt …' : 'Datei-Version ohne 3D'}</small></div>
    <div class="set"><button class="btn alt" data-act="who">Figur und Name ändern</button><button class="btn warn" data-act="reset">Englisch-Lernstand löschen</button></div>
    <h2>Technik</h2>
    <p>Version ${esc(META.version)} (${esc(META.built)}). Aufnahmen: ${ai.clips} (Stimme ${esc(ai.voice)}), WebAudio ${ai.webaudio ? 'ja' : 'nein'}, Gerätestimme ${ai.tts ? (ai.ttsVoices.length ? ai.ttsVoices.length + ' englische' : 'keine englische gefunden') : 'nicht vorhanden'}.
      Spielstand: Schlüssel ${EN.KEY}, Konto: flauschi_konto_v1. Offline: ${navigator.serviceWorker && navigator.serviceWorker.controller ? 'bereit' : 'nur mit Internet (oder Datei-Version)'}.</p>
    <p><button class="btn alt" data-act="about">Über die App</button></p>
  </div>`;
  show('par');
}
function about() {
  modal(`<h2>Flauschis Englisch</h2><p>Version ${esc(META.version)} · ${esc(META.built)}</p>
    ${(META.credits || []).map(c => `<p><b>${esc(c[0])}:</b> ${esc(c[1])}</p>`).join('')}
    <p style="font-size:.85em;opacity:.8;max-width:40em">${esc(META.note || '')}</p>
    <div class="btns"><button class="btn" data-act="close">Schließen</button></div>`);
}

// ---------- Ereignisse ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  switch (a) {
    case 'home': return home();
    case 'topic': return topic(b.dataset.id);
    case 'start': return start(b.dataset.topic, b.dataset.ex);
    case 'daily': return startDaily();
    case 'sortall': return startSort(EN.TOPICS.map(t => t.id), 'sort', 'home');
    case 'test': return startTest();
    case 'testgo': return testGo();
    case 'hear': case 'say': return AU.say(b.dataset.t || EN.word(b.dataset.id).en);
    case 'pick': case 'cat': return pick(b);
    case 'tile': return tile(b);
    case 'key': return typeKey(b.dataset.k);
    case 'cover': return cover();
    case 'next': return next();
    case 'prev': RUN.i = Math.max(0, RUN.i - 1); return renderTask();
    case 'penclear': return RUN.padClear && RUN.padClear();
    case 'pendone': return penDone();
    case 'penself': return penSelf(b.dataset.v === '1');
    case 'quit': { const back = RUN && RUN.back, tp = RUN && RUN.topic; AU.stop(); RUN = null; return back === 'topic' ? topic(tp) : home(); }
    case 'resback': { const back = RUN.back, tp = RUN.topic; closeModal(); return back === 'topic' ? topic(tp) : home(); }
    case 'again': return again();
    case 'close': return closeModal();
    case 'par': return parentsGate();
    case 'gate': if (b.dataset.ok === '1') return parents(); closeModal(); return toast('Das war nicht richtig.');
    case 'voice': S.set.voice = b.dataset.v; AU.setMode(S.set.voice); save(); return parents();
    case 'gfx': S.set.gfx = b.dataset.v; save(); return location.reload();
    case 'setde': S.set.de = b.dataset.v === '1'; save(); return parents();
    case 'who': closeModal(); return who(true);
    case 'about': return about();
    case 'reset': return modal(`<h2>Lernstand löschen?</h2><p>Gelöscht wird nur der Englisch-Fortschritt auf diesem Gerät. Sterne und Tickets im Flauschi-Konto bleiben.</p><div class="btns"><button class="btn alt" data-act="close">Abbrechen</button><button class="btn warn" data-act="resetok">Ja, löschen</button></div>`);
    case 'resetok': { try { LS.setItem(EN.KEY + '_geloescht_' + EN.today(), JSON.stringify(S)); } catch (x) {} const n = S.name, c = S.char; S = EN.fresh(); S.name = n; S.char = c; save(); closeModal(); window.ENAPP.S = S; toast('Gelöscht.'); return parents(); }
  }
});
document.addEventListener('keydown', e => {
  if (!RUN || !task() || task().kind !== 'write' || $('#modal.on')) return;
  if (e.key === 'Backspace') { e.preventDefault(); typeKey('del'); }
  else if (e.key === 'Enter') typeKey('ok');
  else if (e.key === ' ') { e.preventDefault(); typeKey(' '); }
  else if (/^[a-zA-Z]$/.test(e.key)) typeKey(e.key.toLowerCase());
});
// Übungszeit zählen (nur sichtbar und in einer Übung), alle 10 s speichern
let tick = 0;
setInterval(() => { if (RUN && !RUN.done && document.visibilityState !== 'hidden') { EN.day(S).sec++; if (++tick % 10 === 0) save(); } }, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
if (K) { K.persist(); K.onChange(updateKonto); }
// Service Worker (nur Testseite, nicht als Datei)
const PWA = { state: 'aus' };
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.EN_PWA) {
  PWA.state = 'lädt';
  navigator.serviceWorker.register('sw.js').then(() => { PWA.state = 'ok'; }, () => { PWA.state = 'fehler'; });
}

window.ENAPP = { get S() { return S; }, set S(v) { S = v; }, get RUN() { return RUN; }, PWA, home, topic, start, startDaily, startSort, startTest, testGo, parents, typeKey, finish };
who();
// Sobald 3D bereit ist (oder ausfällt): aktuellen Bildschirm neu zeichnen
if (window.K3D) window.K3D.ready.then(() => { if (SCREEN === 'home') home(); else if (SCREEN === 'who') who(true); else if (SCREEN === 'topic' || SCREEN === 'par') { const a = document.querySelector('.scr.on .ava'); if (a) a.innerHTML = fig(me().char, me().wear); } });
})();
</script>
</body>
</html>
